name: tilawa
description: TILAWA - Multilingual Islamic Quranic Learning Platform for iOS & Android
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Networking & API
  dio: ^5.3.0
  retrofit: ^4.0.0
  json_serializable: ^6.7.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0

  # UI Components
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  cached_network_image: ^3.3.0
  smooth_page_indicator: ^1.1.0
  shimmer: ^3.0.0
  lottie: ^2.4.0

  # Audio
  just_audio: ^0.9.31
  audio_session: ^0.1.16

  # Navigation
  go_router: ^10.0.0

  # Localization
  intl: ^0.19.0
  easy_localization: ^3.0.2

  # Authentication
  flutter_secure_storage: ^9.0.0
  google_sign_in: ^6.2.1
  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0

  # Analytics & Monitoring
  firebase_analytics: ^10.7.0
  firebase_crashlytics: ^3.4.0
  sentry_flutter: ^7.11.0

  # Utilities
  timeago: ^3.6.0
  uuid: ^4.0.0
  freezed_annotation: ^2.4.1

  # Environment
  dotenv: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  retrofit_generator: ^8.0.0
  freezed: ^2.4.1
  json_serializable: ^6.7.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/
    - assets/lottie/
    - assets/translations/

  # Fonts
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
